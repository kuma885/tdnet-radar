<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <title>TDnetレーダー - 開示詳細</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      line-height: 1.65;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 36px;
    }
    .top {
      background: #111827;
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
    }
    .brand { font-size: 14px; opacity: .75; }
    h1 {
      margin: 5px 0 0;
      font-size: 25px;
      line-height: 1.35;
    }
    .meta {
      margin-top: 9px;
      font-size: 14px;
      opacity: .8;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .category {
      display: inline-block;
      padding: 5px 10px;
      margin: 0 6px 6px 0;
      border-radius: 999px;
      background: #e5e7eb;
      font-weight: 800;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    .headline {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .summary {
      font-size: 18px;
      line-height: 1.75;
      margin: 0;
    }
    ul {
      padding-left: 1.35em;
      margin: 8px 0 0;
    }
    li {
      margin: 7px 0;
      font-size: 17px;
    }
    .caution {
      border-left: 5px solid #9ca3af;
      padding-left: 12px;
      font-size: 15px;
    }
    .title-original {
      font-size: 16px;
      word-break: break-word;
    }
    .button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border: 0;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 17px;
      font-weight: 850;
      margin-top: 10px;
      background: #2563eb;
      color: white;
    }
    .button.secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 10px;
    }
    .error {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      font-size: 17px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #030712; color: #f9fafb; }
      .card, .error { background: #111827; }
      .category, .button.secondary {
        background: #374151;
        color: #f9fafb;
      }
      .note { color: #9ca3af; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <section class="top">
    <div class="brand">TDnetレーダー</div>
    <h1 id="company">開示情報を読み込み中...</h1>
    <div class="meta" id="meta"></div>
  </section>

  <section class="card" id="original-actions" hidden>
    <a class="button" id="original-link" target="_blank" rel="noopener noreferrer"></a>
    <div class="note">説明を待たずに開けます。</div>
  </section>
  <div id="content" aria-live="polite">
    <section class="card">
      読み込み中...
    </section>
  </div>
</main>

<script>
const WORKER_API = "https://tdnet-monitor.sanndora388.workers.dev/api/detail";
const params = new URLSearchParams(location.search);
const id = params.get("id");
const date = params.get("date") || "";
function esc(value) {
  return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}
function safeTdnetUrl(value) {
  try {
    const url = new URL(value);
    if (url.protocol !== "https:" || url.hostname !== "www.release.tdnet.info" ||
        url.username || url.password || url.port || !url.pathname.startsWith("/inbs/")) return "";
    return url.href;
  } catch { return ""; }
}
function tdnetFallbackUrl(date) {
  return /^\d{8}$/.test(date)
    ? `https://www.release.tdnet.info/inbs/I_list_001_${date}.html`
    : "https://www.release.tdnet.info/inbs/I_main_00.html";
}
const notificationOriginal = safeTdnetUrl(params.get("original"));
function showOriginal(url) {
  const link = document.getElementById("original-link");
  link.href = url;
  link.textContent = /\.pdf$/i.test(new URL(url).pathname) ? "TDnet原文を開く" : "TDnetの開示ページ・一覧を開く";
  document.getElementById("original-actions").hidden = false;
}
function renderExplanation(exp) {
  const points = Array.isArray(exp.points) ? exp.points : [];
  return `<section class="card">
    ${exp.category ? `<span class="category">${esc(exp.category)}</span>` : ""}
    <h2>${esc(exp.headline || "開示の説明")}</h2>
    <p class="summary">${esc(exp.summary || "")}</p>
    ${points.length ? `<h3>ここを見る</h3><ul>${points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${exp.caution ? `<p class="caution">${esc(exp.caution)}</p>` : ""}
  </section>`;
}
async function loadDetail() {
  const content = document.getElementById("content");
  showOriginal(notificationOriginal || tdnetFallbackUrl(date));
  if (!id || !/^[a-f0-9]{24}$/.test(id)) {
    document.getElementById("company").textContent = "開示を特定できませんでした";
    content.innerHTML = `<div class="error">開示IDがありません、または正しくありません。
      <a class="button secondary" href="./">TDnetレーダーへ戻る</a></div>`;
    return;
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(`${WORKER_API}?id=${encodeURIComponent(id)}`, {
      cache: "no-store", signal: controller.signal
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (!data || data.id !== id) throw new Error("異なる開示データ");
    const exps = Array.isArray(data.explanations) && data.explanations.length
      ? data.explanations : [data.explanation || {}];
    const categories = Array.isArray(data.categories) ? data.categories : [];
    showOriginal(safeTdnetUrl(data.originalUrl) || notificationOriginal || tdnetFallbackUrl(data.date || date));
    document.getElementById("company").textContent = `${data.company || ""}（${data.code || ""}）`;
    document.getElementById("meta").textContent = `${data.date || ""} ${data.time || ""}`;
    content.innerHTML = `<section class="card">
      <h2>かんたん説明</h2>
      ${categories.map(c => `<span class="category">${esc(c)}</span>`).join("")}
      <p class="note">タイトルからの説明です。PDF本文の要約ではありません。金額や契約条件は原文で確認してください。</p>
    </section>${exps.map(renderExplanation).join("")}
    <section class="card"><h2>TDnetのタイトル</h2>
      <div class="title-original">${esc(data.title || "")}</div>
      <a class="button secondary" href="./">TDnetレーダーへ戻る</a>
    </section>`;
  } catch (error) {
    document.getElementById("company").textContent = "説明を取得できませんでした";
    document.getElementById("meta").textContent = "";
    content.innerHTML = `<div class="error">保存期限切れや通信エラーの可能性があります。上のボタンから原文・一覧を開けます。
      <button class="button secondary" id="retry">もう一度読み込む</button>
      <a class="button secondary" href="./">TDnetレーダーへ戻る</a></div>`;
    document.getElementById("retry").addEventListener("click", loadDetail);
  } finally { clearTimeout(timer); }
}
loadDetail();
</script>
</body>
</html>
