<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>TDnetレーダー</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "b7c4e99b-5677-452f-b6f5-f29d5d30d45f",
        serviceWorkerPath: "tdnet-radar/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/tdnet-radar/push/" },
        autoResubscribe: true
      });
    });
  </script>

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 20px 14px 40px; }
    .hero {
      background: #111827; color: white; border-radius: 20px;
      padding: 22px; margin-bottom: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { opacity: .8; font-size: 14px; }
    .status {
      display: flex; justify-content: space-between; gap: 12px;
      background: white; color: #111827; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 14px; align-items: center;
    }
    .badge {
      padding: 5px 9px; border-radius: 999px; font-size: 12px;
      background: #fef3c7; color: #92400e; white-space: nowrap;
    }
    .card {
      background: white; color: #111827; border-radius: 16px;
      padding: 8px 14px; margin-bottom: 14px;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 2px; border-bottom: 1px solid #e5e7eb;
    }
    .row:last-child { border-bottom: 0; }
    .name { font-weight: 700; }
    .kind { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .switch { position: relative; width: 50px; height: 30px; }
    .switch input { display: none; }
    .slider {
      position: absolute; inset: 0; background: #d1d5db; border-radius: 99px;
      transition: .2s; cursor: pointer;
    }
    .slider:before {
      content: ""; position: absolute; width: 24px; height: 24px;
      left: 3px; top: 3px; background: white; border-radius: 50%;
      transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider:before { transform: translateX(20px); }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 14px 16px;
      font-weight: 800; font-size: 16px; cursor: pointer;
      background: #2563eb; color: white; margin-top: 8px;
    }
    button.secondary { background: #e5e7eb; color: #111827; }
    .note {
      font-size: 13px; line-height: 1.55; color: #4b5563; margin: 12px 2px 0;
    }
    #log {
      margin-top: 12px; padding: 12px; background: #f9fafb;
      border-radius: 12px; font-size: 13px; min-height: 44px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #030712; color: #f9fafb; }
      .status, .card { background: #111827; color: #f9fafb; }
      .kind, .note { color: #9ca3af; }
      .row { border-color: #374151; }
      button.secondary { background: #374151; color: #f9fafb; }
      #log { background: #1f2937; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>TDnetレーダー</h1>
      <div class="sub">TDnet新着を監視して重要開示を通知</div>
    </section>

    <section class="status">
      <div>
        <strong>監視機能</strong><br>
        <span style="font-size:13px;color:#6b7280">TDnet監視サーバー準備済み・Push設定中</span>
      </div>
      <span class="badge">試作版</span>
    </section>

    <section class="card" id="settings"></section>

    <section class="card" style="padding:14px">
      <strong>通知設定</strong>
      <p class="note">「本物のプッシュ通知を有効にする」を押すと、AndroidのChromeから通知許可を求められます。</p>
      <button id="pushBtn">本物のプッシュ通知を有効にする</button>
      <button class="secondary" id="notifyBtn">端末内テスト通知を出す</button>
      <button class="secondary" id="sampleBtn">サンプル新着を表示</button>
      <div id="log">まだ通知はありません。</div>
    </section>

    <p class="note">
      AI、OpenAI API、ChatGPT Work、Codexは使用しません。
    </p>
  </main>

<script>
const categories = [
  ["上方修正","好材料"],["増配","好材料"],["自社株買い","好材料"],["大型受注","好材料"],
  ["業務提携","好材料"],["M&A","好材料"],["TOB","好材料"],["株式分割","好材料"],
  ["下方修正","悪材料"],["減配","悪材料"],["赤字転落","悪材料"],["希薄化","悪材料"]
];

const settings = document.getElementById("settings");

categories.forEach(([name, kind]) => {
  const key = "tdnet_" + name;
  const saved = localStorage.getItem(key);
  const checked = saved === null ? true : saved === "true";
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div><div class="name">${name}</div><div class="kind">${kind}</div></div>
    <label class="switch">
      <input type="checkbox" ${checked ? "checked" : ""}>
      <span class="slider"></span>
    </label>`;
  const input = row.querySelector("input");
  input.addEventListener("change", () => localStorage.setItem(key, input.checked));
  settings.appendChild(row);
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}

document.getElementById("pushBtn").addEventListener("click", async () => {
  const log = document.getElementById("log");

  try {
    OneSignalDeferred.push(async function(OneSignal) {
      if (!OneSignal.Notifications.isPushSupported()) {
        log.textContent = "このブラウザはWeb Pushに対応していません。";
        return;
      }

      await OneSignal.Notifications.requestPermission();

      if (OneSignal.Notifications.permission) {
        log.textContent = "本物のプッシュ通知を受け取れる状態になりました。";
      } else {
        log.textContent = "通知が許可されませんでした。Android / Chromeの通知設定を確認してください。";
      }
    });
  } catch (e) {
    console.error(e);
    log.textContent = "Push設定中にエラーが発生しました。";
  }
});

document.getElementById("notifyBtn").addEventListener("click", async () => {
  const log = document.getElementById("log");

  if (!("Notification" in window)) {
    log.textContent = "このブラウザは通知機能に対応していません。";
    return;
  }

  let permission = Notification.permission;
  if (permission !== "granted") {
    permission = await Notification.requestPermission();
  }

  if (permission !== "granted") {
    log.textContent = "通知が許可されませんでした。ブラウザ/端末の通知設定を確認してください。";
    return;
  }

  const reg = await navigator.serviceWorker.ready;
  await reg.showNotification("TDnetレーダー", {
    body: "端末内テスト通知成功。",
    icon: "icon-192.png",
    badge: "icon-192.png",
    tag: "tdnet-test"
  });
  log.textContent = "端末内テスト通知を送りました。";
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  document.getElementById("log").innerHTML =
    "<strong>サンプル</strong><br>1234 サンプル株式会社<br>上方修正を検出<br>18:30";
});
</script>
</body>
</html>
